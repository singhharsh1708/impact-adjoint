<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" role="img" aria-label="impact-adjoint">
  <title>impact-adjoint</title>
  <!-- Ground rule. -->
  <path d="M1.5 26H30.5" stroke="#0b0b0b" stroke-width="1.7"
        stroke-linecap="round" opacity=".35"/>
  <!-- Three chained parabolic arcs at restitution e = 0.74: each apex height is
       e^2 times the previous, each flight e times as wide. The mark is the
       physics, not a drawing of it. -->
  <path d="M2 22 Q7.8 -8 13.6 26 Q18.1 6.2 22.8 26 Q26.1 15.2 29.5 26"
        stroke="#0b0b0b" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The impacts, where the derivative jumps. -->
  <circle cx="13.6" cy="26" r="2" fill="#2a78d6"/>
  <circle cx="22.8" cy="26" r="2" fill="#2a78d6"/>
</svg>
