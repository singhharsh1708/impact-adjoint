name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          pip install sphinx furo myst-parser sphinx_copybutton sphinx_design \
                      sphinxext-opengraph sphinxcontrib-mermaid matplotlib pillow
      - name: Build site
        run: python -m sphinx -b html docs/site docs/site/build -W --keep-going -n 2>&1 | tee build.log
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/build

  deploy:
    # Publishing needs Pages enabled, which needs a public repository (private
    # Pages is a paid feature). While the repo is private this job is skipped
    # rather than attempted, so a red X does not sit on every commit. Once the
    # repo is public, enable Pages with Source = GitHub Actions and this runs
    # automatically on the next push to main.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
