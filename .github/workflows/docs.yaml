name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          pip install sphinx furo myst-parser sphinx_copybutton sphinx_design \
                      sphinxext-opengraph sphinxcontrib-mermaid matplotlib pillow \
                      sphinx-sitemap
      - name: Build site
        # Without an explicit shell, Actions runs `bash -e` with no pipefail,
        # so `| tee` swallowed Sphinx's exit status and -W never failed the
        # build. Every provenance guard in docs/site/_ext is a logger.warning,
        # which is only fatal under -W, so this gate was holding nothing up.
        shell: bash
        run: |
          set -o pipefail
          python -m sphinx -b html docs/site docs/site/build -W --keep-going -n 2>&1 | tee build.log
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/build

# No Pages deploy job. The site is served from Vercel at
# impact-adjoint.vercel.app, and that URL is what the README badge, the
# canonical tags, the sitemap, the JSON-LD and CITATION.cff all point at. A
# second live copy on Pages would publish the same pages under a different
# origin and split canonical, so this workflow builds the site with -W as a
# correctness gate and leaves publishing to the deploy script.
