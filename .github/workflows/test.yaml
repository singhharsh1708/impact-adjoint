name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # pinned for reproducibility
        run: |
          pip install "tesseract-core[runtime]==1.11.0" tesseract-jax==0.4.1 \
                      "jax==0.11.0" optax equinox juliacall==0.9.31 \
                      numpy scipy sympy pytest cma
      - name: Golden regression tests
        run: pytest tests/ -v
      - name: FD validation + robustness regressions
        run: python scripts/validate_contact.py
      - name: Independent closed-form oracle
        run: python scripts/validate_closed_form.py
      - name: Cross-implementation reference
        run: python scripts/validate_reference.py
      - name: Randomized property sweep over the declared input space
        run: python scripts/fuzz_solver.py 100 0
